onboarding = false

[theme]
name = "catppuccin"

[keys]
prefix = "ctrl+b"
previous_workspace = "prefix+left"
next_workspace = "prefix+right"
switch_workspace = "prefix+shift+1..9"

[ui.toast]
delivery = "system"

[ui]
show_agent_labels_on_pane_borders = true

[ui.sound]
enabled = false

[experimental]
pane_history = true

[[keys.command]]
key = "prefix+up"
type = "plugin_action"
command = "cloudmanic.herdr-plus.projects"
description = "herdr-plus: projects"

[[keys.command]]
key = "prefix+down"
type = "plugin_action"
command = "cloudmanic.herdr-plus.quick-actions"
description = "herdr-plus: quick actions"

[[keys.command]]
key = "prefix+t"
type = "plugin_action"
command = "herdr-picker-plus.open"
description = "search Herdr"

[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "ezracerpac.jj-waltz.new"
description = "new jw workspace"

[[keys.command]]
key = "prefix+shift+a"
type = "plugin_action"
command = "ezracerpac.jj-waltz.new-tab"
description = "new jw workspace in tab"

[[keys.command]]
key = "prefix+d"
type = "plugin_action"
command = "ezracerpac.jj-waltz.remove"
description = "remove jw workspace"

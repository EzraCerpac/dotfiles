# Personal Rift tracking-build configuration.
# Meh = Meta + Ctrl + Alt; Hyper adds Shift.

[settings]
animate = true
animation_duration = 0.18
animation_fps = 120.0
default_disable = false
focus_follows_mouse = true
mouse_follows_focus = false
mouse_hides_on_focus = false
auto_focus_blacklist = [
  "com.raycast.macos",
  "com.apple.dock",
  "com.apple.systemuiserver",
  "com.apple.SecurityAgent",
  "com.apple.Spotlight",
]
run_on_start = [
  "/opt/homebrew/bin/borders active_color=0xffe1e3e4 inactive_color=0x00000000 width=5.0",
]
hot_reload = true

[settings.layout]
mode = "scrolling"
window_insertion_point = "next_to_selection"

[settings.layout.scrolling]
column_width_ratio = 0.7
single_column_width_ratio = 1.0
min_column_width_ratio = 0.3
max_column_width_ratio = 0.9
alignment = "center"
focus_navigation_style = "niri"

[settings.layout.scrolling.gestures]
enabled = false

[settings.layout.gaps.outer]
top = 10.0
left = 10.0
bottom = 10.0
right = 10.0

[settings.layout.gaps.inner]
horizontal = 10.0
vertical = 10.0

[settings.ui.menu_bar]
enabled = false

[settings.ui.stack_line]
enabled = false

[settings.ui.mission_control]
enabled = true
fade_enabled = true
fade_duration_ms = 180.0

[settings.gestures]
# Four-finger horizontal swipes switch directly between non-empty workspaces.
enabled = true
consume_dock_swipe = true
invert_horizontal_swipe = false
swipe_vertical_tolerance = 0.4
skip_empty = true
fingers = 4
distance_pct = 0.08
haptics_enabled = true
haptic_pattern = "level_change"

[virtual_workspaces]
enabled = true
default_workspace_count = 14
auto_assign_windows = true
preserve_focus_per_workspace = true
workspace_auto_back_and_forth = false
prevent_wrapping = false
default_workspace = 0
reapply_app_rules_on_title_change = true
workspace_names = [
  "Flow",
  "Thesis",
  "ChatGPT",
  "3",
  "4",
  "5",
  "6",
  "7",
  "8",
  "Ops",
  "Browser Hub",
  "Terminal Hub",
  "Comms",
  "Media",
]
workspace_rules = []

app_rules = [
  # Keep transient helpers out of the workspace model. Order matters for ties.
  { app_id = "com.kagi.kagimacOS", title_regex = '^Orion Preview(?:$|[[:space:]]*-)', manage = false },
  { app_id = "com.raycast.macos", manage = false },
  { app_id = "com.chabomakers.Antinote", manage = false },
  { ax_subrole = "AXDialog", manage = false },
  { ax_subrole = "AXSystemDialog", manage = false },
  { ax_role = "AXSheet", floating = true },
  { ax_subrole = "AXFloatingWindow", manage = false },
  { ax_subrole = "AXSystemFloatingWindow", manage = false },
  # Codex labels some compact popups as ordinary windows. Size keeps them out
  # without affecting the full ChatGPT window.
  { app_id = "com.openai.codex", ax_role = "AXWindow", ax_subrole = "AXStandardWindow", max_width = 600.0, max_height = 700.0, manage = false },

  { app_id = "com.kagi.kagimacOS", workspace = "Browser Hub" },
  { app_id = "com.openai.codex", workspace = 2 },
  { app_id = "com.apple.mail", workspace = 12 },
  { app_id = "net.whatsapp.WhatsApp", workspace = 12 },
  { app_id = "com.apple.Music", workspace = 13 },
  { app_id = "com.github.wez.wezterm", title_regex = "(?i)^herdr([[:space:]]|$)", workspace = 11 },
  { app_id = "com.github.wez.wezterm", title_regex = "(?i)^btop([[:space:]]|$)", workspace = 9 },
  { app_id = "com.apple.weather", floating = true },
  { app_id = "com.apple.AddressBook", floating = true },
]

[modifier_combinations]
Meh = "Meta + Ctrl + Alt"
Hyper = "Meta + Ctrl + Alt + Shift"

[keys]
# Meh focus: Neovim and Herdr get first chance; Rift is the fallback.
"Meh + H" = { exec = ["/bin/sh", "-lc", "~/.local/bin/wm-focus left"] }
"Meh + J" = { exec = ["/bin/sh", "-lc", "~/.local/bin/wm-focus down"] }
"Meh + K" = { exec = ["/bin/sh", "-lc", "~/.local/bin/wm-focus up"] }
"Meh + L" = { exec = ["/bin/sh", "-lc", "~/.local/bin/wm-focus right"] }
"Meh + Left" = { exec = ["/bin/sh", "-lc", "~/.local/bin/wm-focus left"] }
"Meh + Down" = { exec = ["/bin/sh", "-lc", "~/.local/bin/wm-focus down"] }
"Meh + Up" = { exec = ["/bin/sh", "-lc", "~/.local/bin/wm-focus up"] }
"Meh + Right" = { exec = ["/bin/sh", "-lc", "~/.local/bin/wm-focus right"] }

# Hyper move.
"Hyper + H" = { move_node = "left" }
"Hyper + J" = { move_node = "down" }
"Hyper + K" = { move_node = "up" }
"Hyper + L" = { move_node = "right" }
"Hyper + Left" = { move_node = "left" }
"Hyper + Down" = { move_node = "down" }
"Hyper + Up" = { move_node = "up" }
"Hyper + Right" = { move_node = "right" }

# Workspace selection.
"F3" = "show_mission_control_all"
"Shift + F3" = "show_mission_control_current"
"Meh + O" = "show_mission_control_all"
"Meh + 0" = { switch_to_workspace = 0 }
"Meh + 1" = { switch_to_workspace = 1 }
"Meh + 2" = { switch_to_workspace = 2 }
"Meh + 3" = { switch_to_workspace = 3 }
"Meh + 4" = { switch_to_workspace = 4 }
"Meh + 5" = { switch_to_workspace = 5 }
"Meh + 6" = { switch_to_workspace = 6 }
"Meh + 7" = { switch_to_workspace = 7 }
"Meh + 8" = { switch_to_workspace = 8 }
"Meh + B" = { switch_to_workspace = 10 }
"Meh + T" = { switch_to_workspace = 11 }
"Meh + E" = { switch_to_workspace = 12 }
"Meh + M" = { exec = ["/bin/sh", "-lc", "~/.local/bin/rift-preferred-workspace switch 13"] }
"Meh + Tab" = "switch_to_last_workspace"
"Hyper + Tab" = { move_window_to_display = { selector = "right" } }
"Meh + [" = { prev_workspace = true }
"Meh + ]" = { next_workspace = true }

# Move and follow.
"Hyper + 0" = { move_window_to_workspace = { workspace = 0, follow = true } }
"Hyper + 1" = { move_window_to_workspace = { workspace = 1, follow = true } }
"Hyper + 2" = { move_window_to_workspace = { workspace = 2, follow = true } }
"Hyper + 3" = { move_window_to_workspace = { workspace = 3, follow = true } }
"Hyper + 4" = { move_window_to_workspace = { workspace = 4, follow = true } }
"Hyper + 5" = { move_window_to_workspace = { workspace = 5, follow = true } }
"Hyper + 6" = { move_window_to_workspace = { workspace = 6, follow = true } }
"Hyper + 7" = { move_window_to_workspace = { workspace = 7, follow = true } }
"Hyper + 8" = { move_window_to_workspace = { workspace = 8, follow = true } }
"Hyper + B" = { move_window_to_workspace = { workspace = 10, follow = true } }
"Hyper + T" = { move_window_to_workspace = { workspace = 11, follow = true } }
"Hyper + E" = { move_window_to_workspace = { workspace = 12, follow = true } }
"Hyper + 9" = { exec = ["/bin/sh", "-lc", "~/.local/bin/rift-preferred-workspace move 9"] }
"Hyper + M" = { exec = ["/bin/sh", "-lc", "~/.local/bin/rift-preferred-workspace launch 13 com.apple.Music Music"] }

# Ops launcher: the helper creates/reuses the temporary btop window.
"Meh + 9" = { exec = ["/bin/sh", "-lc", "~/.local/bin/start-btop --focus"] }

# Scrolling layout and stacking.
"Meh + F" = "toggle_fullscreen_within_gaps"
"Meh + C" = "center_selection"
"Meh + S" = "snap_strip"
"Meh + Slash" = "unjoin_windows"
"Meh + Comma" = "toggle_stack"
"Hyper + Comma" = { consume_or_expel_window = "left" }
"Hyper + Dot" = { consume_or_expel_window = "right" }
"Hyper + Space" = { toggle_window_floating = { center = true, size = "smart" } }
"Meh + Space" = "toggle_focus_floating"
"Meh + Minus" = { resize_window_shrink = "horizontal" }
"Meh + Equal" = { resize_window_grow = "horizontal" }
"Hyper + Minus" = { resize_window_shrink = "vertical" }
"Hyper + Equal" = { resize_window_grow = "vertical" }

# Hyper app launchers.
"Hyper + A" = { exec = ["/usr/bin/open", "-a", "Activity Monitor"] }
"Hyper + F" = { exec = ["/usr/bin/open", "-a", "Finder"] }
"Hyper + W" = { exec = ["/usr/bin/open", "-a", "WhatsApp"] }
"Hyper + Y" = { exec = ["/usr/bin/open", "-a", "System Settings"] }
"Hyper + Enter" = { exec = ["/opt/homebrew/bin/wezterm", "start", "--", "/opt/homebrew/bin/fish", "-l"] }

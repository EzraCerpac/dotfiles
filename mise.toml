[settings]
experimental = true

[tasks.kbd_provision]
description = "Provision Corne QMK and macOS keyboard runtime"
run = "./dot_local/bin/executable_kbd provision"

[tasks.kbd_sync]
description = "Sync keymap + regenerate images + reload HUD"
run = "./dot_local/bin/executable_kbd sync"

[tasks.kbd_build]
description = "Build default UF2"
run = "./dot_local/bin/executable_kbd build"

[tasks.kbd_build_all]
description = "Build all UF2 variants"
run = "./dot_local/bin/executable_kbd build-all"

[tasks.kbd_build_left]
description = "Build left-hand tagged UF2 artifact"
run = "./dot_local/bin/executable_kbd build --left"

[tasks.kbd_build_right]
description = "Build right-hand tagged UF2 artifact"
run = "./dot_local/bin/executable_kbd build --right"

[tasks.kbd_flash_left]
description = "Flash LEFT half and set EE_HANDS left"
depends = ["kbd_build_left"]
run = "./dot_local/bin/executable_kbd flash left"

[tasks.kbd_flash_right]
description = "Flash RIGHT half and set EE_HANDS right"
depends = ["kbd_build_right"]
run = "./dot_local/bin/executable_kbd flash right"

[tasks.kbd_hud]
description = "Reload Hammerspoon HUD"
run = "./dot_local/bin/executable_kbd hud-reload"

[tasks.kbd_images]
description = "Regenerate keymap images"
run = "./dot_local/bin/executable_kbd layout-images"

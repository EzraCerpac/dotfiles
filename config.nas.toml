[vars]
profile = "nas"

[env]
SETUP_PROFILE = "nas"

[tools]
# Keep the NAS additions intentionally small. The common command-line base is
# declared in config.toml and remains available alongside these tools.
uv = { version = "latest", os = ["macos/x64", "linux/x64", "linux/arm64"] }

# NAS system packages stay outside bootstrap ownership. Preserve the host's
# existing Git (CerpacNAS uses ~/.local/share/git-modern); Fish is in base.

# Keep the existing NAS directory layout without a shell hook. These are
# user-owned directories; NAS services and mounted storage remain untouched.
[bootstrap.directories]
"~/Projects" = { mode = "0755" }
"~/Scripts" = { mode = "0755" }
"~/.local/bin" = { mode = "0755" }
"~/.local/share" = { mode = "0700" }


[bootstrap.hooks]
pre-dotfiles = 'export SETUP_PROFILE=nas; bash "${MISE_CONFIG_DIR:-$HOME/.config/mise}/tasks/bootstrap/persist-selected" && bash "${MISE_CONFIG_DIR:-$HOME/.config/mise}/tasks/local/adopt-skeletons.sh" && bash "${MISE_CONFIG_DIR:-$HOME/.config/mise}/tasks/local/seed-configs.sh"'
post-dotfiles = 'export SETUP_PROFILE=nas; bash "${MISE_CONFIG_DIR:-$HOME/.config/mise}/tasks/local/finish-dotfiles.sh"'

# Managed files: individual links preserve application-owned neighbors.
[dotfiles]
"~/.local/bin/nas" = { source = "dotfiles/.local/bin/nas", mode = "symlink", variants = [{ os = "linux" }] }
"~/.codex/skills/work-on-cerpacnas/SKILL.md" = { source = "dotfiles/.codex/skills/work-on-cerpacnas/SKILL.md", mode = "symlink", variants = [{ os = "linux" }] }
"~/.codex/skills/work-on-cerpacnas/agents/openai.yaml" = { source = "dotfiles/.codex/skills/work-on-cerpacnas/agents/openai.yaml", mode = "symlink", variants = [{ os = "linux" }] }
"~/.codex/skills/work-on-cerpacnas/references/projects-manifest.md" = { source = "dotfiles/.codex/skills/work-on-cerpacnas/references/projects-manifest.md", mode = "symlink", variants = [{ os = "linux" }] }
"~/.codex/skills/work-on-cerpacnas/references/remote-policy.md" = { source = "dotfiles/.codex/skills/work-on-cerpacnas/references/remote-policy.md", mode = "symlink", variants = [{ os = "linux" }] }
"~/.codex/skills/work-on-cerpacnas/scripts/nas.py" = { source = "dotfiles/.codex/skills/work-on-cerpacnas/scripts/nas.py", mode = "symlink", variants = [{ os = "linux" }] }
"~/.config/cerpacnas/project-rules/jj-waltz.AGENTS.md" = { source = "dotfiles/.config/cerpacnas/project-rules/jj-waltz.AGENTS.md", mode = "symlink", variants = [{ os = "linux" }] }
"~/.config/cerpacnas/project-rules/thesis.AGENTS.md" = { source = "templates/.config/cerpacnas/project-rules/thesis.AGENTS.md.tera", mode = "template", variants = [{ os = "linux" }] }
"~/.config/cerpacnas/projects.toml" = { source = "templates/.config/cerpacnas/projects.toml.tera", mode = "template", variants = [{ os = "linux" }] }

[vars]
profile = "nas"

[env]
SETUP_PROFILE = "nas"

[tools]
# Keep the NAS additions intentionally small. The common command-line base is
# declared in config.toml and remains available alongside these tools.
btop = { version = "latest", os = ["linux/x64"] }

# NAS system packages stay outside bootstrap ownership. Preserve the host's
# existing Git (CerpacNAS uses ~/.local/share/git-modern); Fish is in base.

# Keep the existing NAS directory layout without a shell hook. These are
# user-owned directories; NAS services and mounted storage remain untouched.
[bootstrap.directories]
"~/Projects" = { mode = "0755" }
"~/Scripts" = { mode = "0755" }
"~/.local/bin" = { mode = "0755" }
"~/.local/share" = { mode = "0700" }


[bootstrap.hooks]
pre-dotfiles = 'export SETUP_PROFILE=nas; bash "${MISE_CONFIG_DIR:-$HOME/.config/mise}/manager/bin/dots" internal persist-selected && bash "${MISE_CONFIG_DIR:-$HOME/.config/mise}/setup-scripts/local/adopt-skeletons.sh"'
post-dotfiles = 'export SETUP_PROFILE=nas; bash "${MISE_CONFIG_DIR:-$HOME/.config/mise}/setup-scripts/local/finish-dotfiles.sh"'

# App-written files kept in encrypted settings history. Each machine saves its
# own copy on its own history branch: list its host-<machine-id> profile in
# variants (the stream name in history, so never change an existing one).
[dotfiles]
"~/.codex/config.toml" = { mode = "track", encrypt = true, variants = [{ profile = "host-cerpacnas" }] }
"~/.config/fish/fish_variables" = { mode = "track", encrypt = true, variants = [{ profile = "host-cerpacnas" }] }
"~/.config/atuin/config.toml" = { mode = "track", encrypt = true, variants = [{ profile = "host-cerpacnas" }] }
"~/.config/nvim/lazyvim.json" = { mode = "track", encrypt = true, variants = [{ profile = "host-cerpacnas" }] }
"~/.config/nvim/lazy-lock.json" = { mode = "track", encrypt = true, variants = [{ profile = "host-cerpacnas" }] }
"~/.config/nvim/spell/en.utf-8.add" = { mode = "track", encrypt = true, variants = [{ profile = "host-cerpacnas" }] }

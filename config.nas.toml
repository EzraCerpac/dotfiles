[vars]
profile = "nas"

[env]
SETUP_PROFILE = "nas"

[tools]
# Keep the NAS additions intentionally small. The common command-line base is
# declared in config.toml and remains available alongside these tools.
node = { version = "latest", os = ["macos/x64", "linux/x64", "linux/arm64"] }
uv = { version = "latest", os = ["macos/x64", "linux/x64", "linux/arm64"] }

# DSM remains outside bootstrap package ownership; no native package installs.


[bootstrap.hooks]
pre-dotfiles = 'export SETUP_PROFILE=nas; bash "${MISE_CONFIG_DIR:-$HOME/.config/mise}/tasks/bootstrap/persist-selected" && bash "${MISE_CONFIG_DIR:-$HOME/.config/mise}/tasks/local/adopt-skeletons.sh" && bash "${MISE_CONFIG_DIR:-$HOME/.config/mise}/tasks/local/prepare-directories.sh" && bash "${MISE_CONFIG_DIR:-$HOME/.config/mise}/tasks/local/seed-configs.sh"'
post-dotfiles = 'export SETUP_PROFILE=nas; bash "${MISE_CONFIG_DIR:-$HOME/.config/mise}/tasks/local/finish-dotfiles.sh"'

# Managed files: individual links preserve application-owned neighbors.
[dotfiles]
"~/.config/cerpacnas/project-rules/jj-waltz.AGENTS.md" = { source = "dotfiles/.config/cerpacnas/project-rules/jj-waltz.AGENTS.md", mode = "symlink", variants = [{ os = "linux" }] }
"~/.config/cerpacnas/project-rules/thesis.AGENTS.md" = { source = "templates/.config/cerpacnas/project-rules/thesis.AGENTS.md.tera", mode = "template", variants = [{ os = "linux" }] }
"~/.config/cerpacnas/projects.toml" = { source = "templates/.config/cerpacnas/projects.toml.tera", mode = "template", variants = [{ os = "linux" }] }

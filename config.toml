# Shared settings. The base is always loaded; select workstation or nas with -E.
min_version = "2026.10.3"

[settings]
dotfiles.root = "~/.config/mise/dotfiles"
trusted_config_paths = ["~/Projects", "~/.config/mise"]
# Keep a project's rust-toolchain.toml ahead of the workstation Rust default.
idiomatic_version_file_enable_tools = ["rust"]
history.sync = "manual"
# Maintenance must be able to inspect a partially installed setup.
task.run_auto_install = false
github.credential_command = 'sh "${MISE_CONFIG_DIR:-$HOME/.config/mise}/setup-scripts/lib/github-credential.sh"'
auto_update = true

# Files in this config directory load globally, and a tasks/ directory here is
# discovered from projects under HOME. Include setup tasks only at the setup root.
[task_config]
includes = [
    "{% if cwd == get_env(name='MISE_CONFIG_DIR', default=env.HOME ~ '/.config/mise') %}{{ get_env(name='MISE_CONFIG_DIR', default=env.HOME ~ '/.config/mise') }}/setup-tasks.toml{% else %}/__mise_setup_tasks_disabled__{% endif %}",
    "{% if cwd == get_env(name='MISE_CONFIG_DIR', default=env.HOME ~ '/.config/mise') %}{{ get_env(name='MISE_CONFIG_DIR', default=env.HOME ~ '/.config/mise') }}/setup-scripts{% else %}/__mise_setup_tasks_disabled__{% endif %}",
]

[vars]
name = "Ezra Cerpac"
email = "47384389+EzraCerpac@users.noreply.github.com"
nas_jj_waltz_sha256 = "d175a4922264c32378f538ed7b6382028df68ecd2eaec564e4db75e2361ae2f8"
nas_jj_waltz_version = "0.3.1"
aegis_bundle_id = "Aegis.Aegis"
aegis_local_revision = "0b48a069ff81840f39f537e928e4589b0ef1ae3a"
aegis_sha256 = "89fc260fb5f0ccc437161c1d61614398ea2b97985668fea514365b4076d12c59"
aegis_signing_identity = "Aegis Local Code Signing"
aegis_url = "https://github.com/CCMurphy-dev/Aegis/releases/download/v1.1.0/Aegis.app.zip"
aegis_version = "1.1.0"
rift_local_revision = "b6cda064c6841c0cf20042e26bcdafb6bb2f9a64"
rift_signing_identity = "Rift Local Code Signing"

# Small, portable command-line tools available on every managed host. Keep
# workstation-only runtimes and applications in config.workstation.toml.
[tools]
# Official standalone Fish avoids old distribution versions and gives every
# Linux role the same shell without replacing /usr/bin/fish.
"github:fish-shell/fish-shell" = { version = "latest", os = ["linux/x64", "linux/arm64"] }
# Bootstrap orchestration and the shared Codex CLI both need Node.
node = { version = "latest", os = ["macos/arm64", "macos/x64", "linux/x64", "linux/arm64"] }
age = { version = "latest", os = ["macos/arm64", "macos/x64", "linux/x64", "linux/arm64"] }
uv = { version = "latest", os = ["macos/arm64", "macos/x64", "linux/x64", "linux/arm64"] }
# Aqua excludes Intel macOS; use its official release directly on that platform.
atuin = { version = "latest", os = ["macos/arm64", "linux/x64", "linux/arm64"] }
"github:atuinsh/atuin" = { version = "latest", os = ["macos/x64"], asset_pattern = "atuin-x86_64-apple-darwin.tar.gz" }
bat = { version = "latest", os = ["macos/arm64", "macos/x64", "linux/x64", "linux/arm64"] }
carapace = { version = "latest", os = ["macos/arm64", "macos/x64", "linux/x64", "linux/arm64"] }
# Delta ships no darwin/amd64 builds; keep it off Intel macOS.
delta = { version = "latest", os = ["macos/arm64", "linux/x64", "linux/arm64"] }
fd = { version = "latest", os = ["macos/arm64", "macos/x64", "linux/x64", "linux/arm64"] }
fzf = { version = "latest", os = ["macos/arm64", "macos/x64", "linux/x64", "linux/arm64"] }
gh = { version = "latest", os = ["macos/arm64", "macos/x64", "linux/x64", "linux/arm64"] }
# Hunk uses native Brew ownership on macOS; its release backend provides the
# same command on Linux without pulling in the Mac tap.
"aqua:modem-dev/hunk" = { version = "latest", os = ["linux/x64", "linux/arm64"] }
# Keep the full Neovim configuration usable wherever the base is selected.
"aqua:neovim/neovim" = { version = "latest", os = ["macos/arm64", "macos/x64", "linux/x64", "linux/arm64"] }
jj = { version = "latest", os = ["macos/arm64", "macos/x64", "linux/x64", "linux/arm64"] }
jq = { version = "latest", os = ["macos/arm64", "macos/x64", "linux/x64", "linux/arm64"] }
ripgrep = { version = "latest", os = ["macos/arm64", "macos/x64", "linux/x64", "linux/arm64"] }
starship = { version = "latest", os = ["macos/arm64", "macos/x64", "linux/x64", "linux/arm64"] }
tmux = { version = "latest", os = ["macos/arm64", "macos/x64", "linux/x64", "linux/arm64"] }
"vfox:jdx/vfox-eza" = { version = "latest", os = ["macos/arm64", "macos/x64", "linux/x64", "linux/arm64"] }
zoxide = { version = "latest", os = ["macos/arm64", "macos/x64", "linux/x64", "linux/arm64"] }
# `dots publish` refuses to push until gitleaks has scanned the commits.
gitleaks = { version = "latest", os = ["macos/arm64", "macos/x64", "linux/x64", "linux/arm64"] }
codex = "latest"
"aqua:librespeed/speedtest-cli" = "latest"

# Native macOS integration. Linux Fish is a user-space tool above; Linux
# workstation Git packages are declared in config.workstation.toml.
[bootstrap.packages]
# Intel macOS gets these through the intel-brew-basics exception: mise's brew
# bootstrap backend skips darwin/amd64 (upstream jdx/mise#10968).
"brew:fish" = { os = "macos/arm64" }
"brew:git" = { os = "macos/arm64" }

# These files are useful on every workstation and on the NAS. Keep each file
# as an individual entry so application state beside it remains unmanaged.
[dotfiles]
"~/.config/kanata/config.kbd" = { source = "dotfiles/.config/kanata/config.kbd", mode = "symlink" }
"~/.bash_profile" = { source = "dotfiles/.bash_profile", mode = "symlink" }
"~/.bashrc" = { source = "templates/.bashrc.tera", mode = "template" }
"~/.codex/AGENTS.md" = { source = "dotfiles/.codex/AGENTS.md", mode = "symlink", variants = [{ os = "macos", profile = "workstation" }] }
".codex/AGENTS.linux.md" = { source = "dotfiles/.codex/AGENTS.linux.md", mode = "symlink", variants = [{ os = "linux", profile = "workstation", target = "~/.codex/AGENTS.md" }] }
".codex/AGENTS.cerpacnas.md" = { source = "dotfiles/.codex/AGENTS.cerpacnas.md", mode = "symlink", variants = [{ os = "linux", profile = "nas", target = "~/.codex/AGENTS.md" }] }
".codex/AGENTS.driehuisnas.md" = { source = "dotfiles/.codex/AGENTS.driehuisnas.md", mode = "symlink", variants = [{ os = "macos", profile = "nas", target = "~/.codex/AGENTS.md" }] }
"~/.codex/app-settings/git-commit-prompt.md" = { source = "dotfiles/.codex/app-settings/git-commit-prompt.md", mode = "symlink" }
"~/.codex/app-settings/git-pr-prompt.md" = { source = "dotfiles/.codex/app-settings/git-pr-prompt.md", mode = "symlink" }
"~/.codex/skills/jj-waltz/SKILL.md" = { source = "dotfiles/.codex/skills/jj-waltz/SKILL.md", mode = "symlink" }
"~/.codex/skills/jj-waltz/agents/openai.yaml" = { source = "dotfiles/.codex/skills/jj-waltz/agents/openai.yaml", mode = "symlink" }
"~/.codex/skills/jj-waltz/references/codex.md" = { source = "dotfiles/.codex/skills/jj-waltz/references/codex.md", mode = "symlink" }
"~/.codex/skills/jj-waltz/references/lifecycle.md" = { source = "dotfiles/.codex/skills/jj-waltz/references/lifecycle.md", mode = "symlink" }
"~/.codex/skills/jj-waltz/references/links.md" = { source = "dotfiles/.codex/skills/jj-waltz/references/links.md", mode = "symlink" }
"~/.config/fish/completions/dots.fish" = { source = "dotfiles/.config/fish/completions/dots.fish", mode = "symlink" }
"~/.config/fish/completions/eza.fish" = { source = "dotfiles/.config/fish/completions/eza.fish", mode = "symlink" }
"~/.config/fish/completions/ls.fish" = { source = "dotfiles/.config/fish/completions/ls.fish", mode = "symlink" }
"~/.config/fish/completions/oc.fish" = { source = "dotfiles/.config/fish/completions/oc.fish", mode = "symlink" }
"~/.config/fish/conf.d/atuin.env.fish" = { source = "dotfiles/.config/fish/conf.d/atuin.env.fish", mode = "symlink" }
"~/.config/fish/config.fish" = { source = "dotfiles/.config/fish/config.fish", mode = "symlink" }
"~/.config/fish/functions/__dots_source_init.fish" = { source = "dotfiles/.config/fish/functions/__dots_source_init.fish", mode = "symlink" }
"~/.config/fish/functions/fish_user_key_bindings.fish" = { source = "dotfiles/.config/fish/functions/fish_user_key_bindings.fish", mode = "symlink" }
"~/.config/gh/config.yml" = { source = "dotfiles/.config/gh/config.yml", mode = "symlink" }
"~/.config/git/config" = { source = "templates/.config/git/config.tera", mode = "template" }
"~/.config/jj-waltz/config.toml" = { source = "dotfiles/.config/jj-waltz/config.toml", mode = "symlink" }
"~/.config/jj/agent-config.toml" = { source = "dotfiles/.config/jj/agent-config.toml", mode = "symlink" }
"~/.config/jj/config.toml" = { source = "dotfiles/.config/jj/config.toml", mode = "symlink" }
"~/.config/hunk/config.toml" = { source = "dotfiles/.config/hunk/config.toml", mode = "symlink" }
"~/.config/starship-jj/starship-jj.toml" = { source = "dotfiles/.config/starship-jj/starship-jj.toml", mode = "symlink" }
"~/.config/starship.toml" = { source = "dotfiles/.config/starship.toml", mode = "symlink" }
"~/.editorconfig" = { source = "dotfiles/.editorconfig", mode = "symlink" }
"~/.gitignore" = { source = "dotfiles/home.gitignore", mode = "symlink" }
"~/.local/bin/dots" = { source = "dotfiles/.local/bin/dots", mode = "symlink" }
"~/.local/bin/kbd" = { source = "dotfiles/.local/bin/kbd", mode = "symlink", variants = [{ os = "macos" }] }

[bootstrap.hooks]
pre-packages = 'bash "${MISE_CONFIG_DIR:-$HOME/.config/mise}/setup-scripts/local/ensure-homebrew-exceptions.sh"'

[bootstrap.brew.taps]
"modem-dev/tap" = "https://github.com/modem-dev/homebrew-tap"

[bootstrap]
dotfile_groups = ["bat", "nvim"]

[dotfile_groups.bat]
root = ".config/bat"
target = "~/.config/bat"
mode = "symlink-each"
relative = false

[dotfile_groups.nvim]
root = ".config/nvim"
target = "~/.config/nvim"
mode = "symlink-each"
relative = false

[tasks.kbd_provision]
description = "Provision Corne QMK and macOS keyboard runtime"
run = "./dotfiles/.local/bin/kbd provision"

[tasks.kbd_sync]
description = "Sync keymap + regenerate images + reload HUD"
run = "./dotfiles/.local/bin/kbd sync"

[tasks.kbd_build]
description = "Build default UF2"
run = "./dotfiles/.local/bin/kbd build"

[tasks.kbd_build_all]
description = "Build all UF2 variants"
run = "./dotfiles/.local/bin/kbd build-all"

[tasks.kbd_build_left]
description = "Build left-hand tagged UF2 artifact"
run = "./dotfiles/.local/bin/kbd build --left"

[tasks.kbd_build_right]
description = "Build right-hand tagged UF2 artifact"
run = "./dotfiles/.local/bin/kbd build --right"

[tasks.kbd_flash_left]
description = "Flash LEFT half and set EE_HANDS left"
depends = ["kbd_build_left"]
run = "./dotfiles/.local/bin/kbd flash left"

[tasks.kbd_flash_right]
description = "Flash RIGHT half and set EE_HANDS right"
depends = ["kbd_build_right"]
run = "./dotfiles/.local/bin/kbd flash right"

[tasks.kbd_hud]
description = "Reload Hammerspoon HUD"
run = "./dotfiles/.local/bin/kbd hud-reload"

[tasks.kbd_images]
description = "Regenerate keymap images"
run = "./dotfiles/.local/bin/kbd layout-images"

[tasks."local:seed-configs"]
run = "bash tasks/local/seed-configs.sh"
dir = "{{ get_env(name='MISE_CONFIG_DIR', default=env.HOME ~ '/.config/mise') }}"

[tasks."local:finish-dotfiles"]
run = "bash tasks/local/finish-dotfiles.sh"
dir = "{{ get_env(name='MISE_CONFIG_DIR', default=env.HOME ~ '/.config/mise') }}"


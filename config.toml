[bootstrap.hooks]
pre-packages = 'bash "${MISE_CONFIG_DIR:-$HOME/.config/mise}/setup-scripts/local/ensure-homebrew-exceptions.sh"'

[bootstrap.brew.taps]
"modem-dev/tap" = "https://github.com/modem-dev/homebrew-tap"

[bootstrap]
dotfile_groups = ["bat", "nvim", "rex-themes"]

[dotfile_groups.bat]
root = ".config/bat"
target = "~/.config/bat"
mode = "symlink-each"
relative = false

[dotfile_groups.nvim]
root = ".config/nvim"
target = "~/.config/nvim"
mode = "symlink-each"
relative = false

[dotfile_groups.rex-themes]
root = ".config/rex/themes"
target = "~/.config/rex/themes"
mode = "symlink-each"
relative = false

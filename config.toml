# Shared settings. Select workstation, nas, or delftblue with -E.
min_version = "2026.9.7"

[settings]
dotfiles.root = "~/.config/mise/dotfiles"
trusted_config_paths = ["~/Projects", "~/.config/mise"]
# Keep a project's rust-toolchain.toml ahead of the workstation Rust default.
idiomatic_version_file_enable_tools = ["rust"]
history.sync = "manual"
# Maintenance must be able to inspect a partially installed setup.
task.run_auto_install = false
github.credential_command = 'sh "${MISE_CONFIG_DIR:-$HOME/.config/mise}/tasks/lib/github-credential.sh"'

[vars]
name = "Ezra Cerpac"
email = "47384389+EzraCerpac@users.noreply.github.com"
nas_dotfiles_branch = "main"
nas_host_alias = "nas"
nas_jj_waltz_sha256 = "d175a4922264c32378f538ed7b6382028df68ecd2eaec564e4db75e2361ae2f8"
nas_jj_waltz_version = "0.3.1"
delftblue_default_cpu_partition = "compute-p2"
delftblue_default_gpu_partition = "gpu-a100-small"
delftblue_host_alias = "delftblue"
delftblue_hostname = "login.delftblue.tudelft.nl"
delftblue_module_stack = "2025"
delftblue_netid = "ecerpac"
delftblue_project_storage_root = ""
delftblue_slurm_account = "education-eemcs-msc-cosse"
aegis_bundle_id = "Aegis.Aegis"
aegis_local_revision = "0b48a069ff81840f39f537e928e4589b0ef1ae3a"
aegis_sha256 = "89fc260fb5f0ccc437161c1d61614398ea2b97985668fea514365b4076d12c59"
aegis_signing_identity = "Aegis Local Code Signing"
aegis_url = "https://github.com/CCMurphy-dev/Aegis/releases/download/v1.1.0/Aegis.app.zip"
aegis_version = "1.1.0"
rift_local_revision = "b6cda064c6841c0cf20042e26bcdafb6bb2f9a64"
rift_signing_identity = "Rift Local Code Signing"

[tasks."setup:status"]
description = "Inspect setup health"
run = "bash tasks/setup/status"
dir = "{{ get_env(name='MISE_CONFIG_DIR', default=env.HOME ~ '/.config/mise') }}"

[tasks."setup:update"]
description = "Update the machine setup"
raw = true
run = "bash tasks/setup/update"
dir = "{{ get_env(name='MISE_CONFIG_DIR', default=env.HOME ~ '/.config/mise') }}"

[tasks."setup:backup"]
description = "Backup the machine setup"
run = "bash tasks/setup/backup"
dir = "{{ get_env(name='MISE_CONFIG_DIR', default=env.HOME ~ '/.config/mise') }}"

[tasks."setup:restore"]
description = "Restore the machine setup"
run = "bash tasks/setup/restore"
dir = "{{ get_env(name='MISE_CONFIG_DIR', default=env.HOME ~ '/.config/mise') }}"

[tasks."setup:secrets"]
description = "Deploy encrypted private configuration"
run = "bash tasks/setup/secrets"
dir = "{{ get_env(name='MISE_CONFIG_DIR', default=env.HOME ~ '/.config/mise') }}"


[tasks."install:herdr-plugins"]

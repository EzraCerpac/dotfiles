# Native shells and Git are installed by the host package manager. These
# entries are shared by workstation and NAS; a NAS without a supported native
# package manager must provide them before applying its profile.
[bootstrap.packages]
# Intel macOS gets these through the intel-brew-basics exception: mise's brew
# bootstrap backend skips darwin/amd64 (upstream jdx/mise#10968).
"brew:fish" = { os = "macos/arm64" }
"brew:git" = { os = "macos/arm64" }
"brew:diffnav" = { os = "macos/arm64" }
"apt:fish" = { os = ["linux/x64", "linux/arm64"] }
"apt:git" = { os = ["linux/x64", "linux/arm64"] }
"dnf:fish" = { os = ["linux/x64", "linux/arm64"] }
"dnf:git" = { os = ["linux/x64", "linux/arm64"] }
"pacman:fish" = { os = ["linux/x64", "linux/arm64"] }
"pacman:git" = { os = ["linux/x64", "linux/arm64"] }

# These files are useful on every workstation and on the NAS. Keep each file
# as an individual entry so application state beside it remains unmanaged.

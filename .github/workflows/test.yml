name: Tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly canary. Tools track "latest", so an upstream release can break the
    # setup without any change here; find out before `dots up` does.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      # mise uses the token for GitHub release lookups instead of anonymous rate limits.
      GITHUB_TOKEN: ${{ github.token }}
      MISE_YES: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install system packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends jq rsync zsh

      - name: Install system packages (macOS)
        if: runner.os == 'macOS'
        run: brew install fish

      - name: Install mise and test tools
        run: |
          curl -fsSL https://mise.run | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          tools=(node@latest python@3.13 uv@latest jj@latest age@latest gitleaks@latest)
          if [[ "$RUNNER_OS" == Linux ]]; then
            tools+=(github:fish-shell/fish-shell@latest)
          fi
          mise use --global "${tools[@]}"
          # Real install paths, not shims: tests replace HOME and mise config dirs.
          (cd "$RUNNER_TEMP" && mise bin-paths) >> "$GITHUB_PATH"
          # These uv scripts declare PyYAML and tomlkit; their tests import them directly.
          "$(cd "$RUNNER_TEMP" && mise which python3)" -m pip install --quiet pyyaml tomlkit

      - name: Tool versions
        run: |
          mise --version
          for tool in node python3 uv jj age gitleaks jq fish zsh; do
            printf '%-8s %s\n' "$tool" "$(command -v "$tool" || echo missing)"
          done

      - name: Run tests
        run: tests/run

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ github.token }}
      MISE_YES: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          # Scan every commit: a secret removed later is still public.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -fsSL https://mise.run | sh
          "$HOME/.local/bin/mise" use --global gitleaks@latest
          (cd "$RUNNER_TEMP" && "$HOME/.local/bin/mise" bin-paths) >> "$GITHUB_PATH"

      - name: Scan history with the repository's gitleaks config
        # Include merge diffs, which `git log` omits by default.
        run: gitleaks git --no-banner --redact --verbose --log-opts='--all --full-history --diff-merges=first-parent' .

  bootstrap:
    name: Bootstrap (Linux, ${{ matrix.profile }})
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        profile: [workstation, nas]
    steps:
      - name: Install container prerequisites
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            build-essential ca-certificates curl git jq libssl-dev pkg-config rsync unzip xz-utils

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Adopt the profile with the published dots archive
        shell: bash
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          fixture="$(mktemp -d)"
          version="$(sed -n 's/^"github:EzraCerpac\/dots" = "\(.*\)"$/\1/p' config.toml)"
          archive="dots-$version-linux-amd64.tar.gz"
          release="https://github.com/EzraCerpac/dots/releases/download/v$version"
          git init --bare --initial-branch=dev "$fixture/source.git"
          git push "$fixture/source.git" HEAD:dev
          mkdir -p "$fixture/home/.local/bin" "$fixture/tmp"
          cd "$fixture"
          curl -fsSLO "$release/$archive"
          curl -fsSLO "$release/SHA256SUMS"
          awk -v file="$archive" '$2 == file' SHA256SUMS | sha256sum --check
          curl -fsSLo install.sh "https://raw.githubusercontent.com/EzraCerpac/dots/v$version/install.sh"
          curl -fsSL https://mise.run | MISE_INSTALL_PATH="$fixture/home/.local/bin/mise" sh

          env -i HOME="$fixture/home" TMPDIR="$fixture/tmp" PATH="$fixture/home/.local/bin:/usr/bin:/bin:/usr/sbin:/sbin" \
            XDG_CONFIG_HOME="$fixture/home/.config" XDG_DATA_HOME="$fixture/data" \
            XDG_STATE_HOME="$fixture/state" XDG_CACHE_HOME="$fixture/cache" \
            MISE_YES=1 GIT_CONFIG_NOSYSTEM=1 \
            FIXTURE="$fixture" PROFILE="$PROFILE" VERSION="$version" ARCHIVE="$archive" bash -euo pipefail <<'SH'
          git config --global url."file://$FIXTURE/source.git".insteadOf https://github.com/EzraCerpac/dotfiles
          sh "$FIXTURE/install.sh" --version "$VERSION" --archive "$FIXTURE/$ARCHIVE" \
            --from https://github.com/EzraCerpac/dotfiles --profile "$PROFILE" 2>&1 | tee "$FIXTURE/bootstrap.log"
          grep -F 'Bootstrap result:' "$FIXTURE/bootstrap.log"
          grep -F '0 failed' "$FIXTURE/bootstrap.log"
          cd "$XDG_CONFIG_HOME/mise"
          test "$(dots profile)" = "$PROFILE"
          selected="$(mise config get --file config.local.toml env.SETUP_MACHINE_ID)"
          test -n "$selected"
          # The installer persists again after completion. Its final selection must agree.
          grep -F "Selected mise profile $PROFILE for host $selected." "$FIXTURE/bootstrap.log" | test "$(wc -l)" -eq 2
          test -L "$HOME/.bash_profile"
          SH

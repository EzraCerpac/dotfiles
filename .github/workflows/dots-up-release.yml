name: Release dots-up

on:
  push:
    tags: ["dots-up-v*"]

permissions:
  contents: read

jobs:
  test:
    name: Test on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version-file: setup-scripts/dots-up/go.mod
          cache-dependency-path: setup-scripts/dots-up/go.sum
      - name: Verify modules and run Go checks
        working-directory: setup-scripts/dots-up
        run: |
          go mod verify
          go test ./...
          go vet ./...
      - name: Run CLI PTY fixtures
        run: python3 tests/test_dots_up_cli.py

  release:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version-file: setup-scripts/dots-up/go.mod
          cache-dependency-path: setup-scripts/dots-up/go.sum
      - name: Build release assets
        working-directory: setup-scripts/dots-up
        run: |
          test -f go.sum
          go mod verify
          mkdir -p "$GITHUB_WORKSPACE/dist"
          for os in darwin linux; do
            for arch in arm64 amd64; do
              CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -mod=readonly -trimpath \
                -o "$GITHUB_WORKSPACE/dist/dots-up-$os-$arch" ./cmd/dots-up
            done
          done
          cd "$GITHUB_WORKSPACE/dist"
          sha256sum dots-up-* > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/dots-up-* dist/SHA256SUMS --verify-tag --title "$TAG" --notes-file .github/dots-up-release-notes.md

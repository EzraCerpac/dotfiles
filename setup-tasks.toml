# Included only when mise runs in the setup checkout.
["setup:status"]
description = "Inspect setup health"
run = "bash setup-scripts/setup/status"
dir = "{{ get_env(name='MISE_CONFIG_DIR', default=env.HOME ~ '/.config/mise') }}"

["setup:update"]
description = "Update the machine setup"
raw = true
run = "bash setup-scripts/setup/update"
dir = "{{ get_env(name='MISE_CONFIG_DIR', default=env.HOME ~ '/.config/mise') }}"

["setup:backup"]
description = "Backup the machine setup"
run = "bash setup-scripts/setup/backup"
dir = "{{ get_env(name='MISE_CONFIG_DIR', default=env.HOME ~ '/.config/mise') }}"

["setup:restore"]
description = "Restore the machine setup"
run = "bash setup-scripts/setup/restore"
dir = "{{ get_env(name='MISE_CONFIG_DIR', default=env.HOME ~ '/.config/mise') }}"

["setup:secrets"]
description = "Deploy encrypted private configuration"
run = "bash setup-scripts/setup/secrets"
dir = "{{ get_env(name='MISE_CONFIG_DIR', default=env.HOME ~ '/.config/mise') }}"

["jev:save-key"]
description = "Save a Jev API key privately and encrypt it with age"
run = "bash setup-scripts/setup/jev-secret save"
raw = true
dir = "{{ get_env(name='MISE_CONFIG_DIR', default=env.HOME ~ '/.config/mise') }}"

["jev:restore-key"]
description = "Restore the private Jev key from its age-encrypted copy"
run = "bash setup-scripts/setup/jev-secret restore"
dir = "{{ get_env(name='MISE_CONFIG_DIR', default=env.HOME ~ '/.config/mise') }}"

["jev:sift-build"]
description = "Rebuild the current Sift checkout with locked dependencies"
dir = "{{ env.HOME }}/Projects/Tools/sift"
run = ["npm ci", "npm run build"]

["jev:unclutter-build"]
description = "Rebuild the current Unclutter Chromium extension"
dir = "{{ env.HOME }}/Projects/Tools/unclutter"
run = ["mise exec bun@1.4.2 -- bun install --frozen-lockfile", "mise exec bun@1.4.2 -- bun run build"]

["jev:unclutter-firefox-build"]
description = "Build the alternate Unclutter Firefox extension"
dir = "{{ env.HOME }}/Projects/Tools/unclutter"
run = ["mise exec bun@1.4.2 -- bun install --frozen-lockfile", "mise exec bun@1.4.2 -- bun run build:firefox"]


["install:herdr-plugins"]
description = "Herdr plugins"
run = "bash setup-scripts/install/herdr-plugins.sh"
dir = "{{ get_env(name='MISE_CONFIG_DIR', default=env.HOME ~ '/.config/mise') }}"


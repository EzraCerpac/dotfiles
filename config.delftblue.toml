[vars]
profile = "delftblue"

[env]
SETUP_PROFILE = "delftblue"

# Cluster setup applies files only; no tools, packages, or services.


[bootstrap.hooks]
pre-dotfiles = 'export SETUP_PROFILE=delftblue; bash "${MISE_CONFIG_DIR:-$HOME/.config/mise}/tasks/bootstrap/persist-selected" && bash "${MISE_CONFIG_DIR:-$HOME/.config/mise}/tasks/local/prepare-directories.sh" && bash "${MISE_CONFIG_DIR:-$HOME/.config/mise}/tasks/local/seed-configs.sh" && bash "${MISE_CONFIG_DIR:-$HOME/.config/mise}/tasks/local/private-permissions.sh" --prepare-source'
post-dotfiles = 'export SETUP_PROFILE=delftblue; bash "${MISE_CONFIG_DIR:-$HOME/.config/mise}/tasks/local/finish-dotfiles.sh"'

# Managed files: individual links preserve application-owned neighbors.
[dotfiles]
"~/.DELFTBLUE.md" = { source = "templates/.DELFTBLUE.md.tera", mode = "template", variants = [{ os = "linux" }] }
"~/.bash_profile" = { source = "dotfiles/.bash_profile", mode = "symlink", variants = [{ os = "linux" }] }
"~/.bashrc" = { source = "templates/.bashrc.tera", mode = "template", variants = [{ os = "linux" }] }
"~/.config/atuin/config.toml" = { source = "templates/.config/atuin/config.toml.tera", mode = "template", variants = [{ os = "linux" }] }

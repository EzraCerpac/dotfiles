"aqua:jdx/usage" = { version = "latest", os = ["macos/arm64", "linux/x64", "linux/arm64"] }
worktrunk = { version = "latest", os = ["macos/arm64", "linux/x64", "linux/arm64"] }
xcodegen = { version = "latest", os = ["macos/arm64"] }
yazi = { version = "latest", os = ["macos/arm64", "linux/x64", "linux/arm64"] }
yt-dlp = { version = "latest", os = ["macos/arm64", "linux/x64", "linux/arm64"] }
zoxide = { version = "latest", os = ["macos/arm64", "linux/x64", "linux/arm64"] }
"github:openclaw/remindctl" = { version = "latest", os = ["macos/arm64"] }

# Global npm CLIs currently installed with npm -g. portless is a local
# checkout symlink and stays owned by its project instead.
"npm:@earendil-works/pi-coding-agent" = { version = "latest", os = ["macos/arm64", "linux/x64", "linux/arm64"] }
"npm:@openai/codex" = { version = "latest", os = ["macos/arm64", "linux/x64", "linux/arm64"] }
"npm:@zed-industries/codex-acp" = { version = "latest", os = ["macos/arm64", "linux/x64", "linux/arm64"] }
"npm:agent-browser" = { version = "latest", os = ["macos/arm64", "linux/x64", "linux/arm64"] }

# Global UV tools use Mise's pipx backend except apps with named installer
# exceptions. Select an explicit Mise Python where a tool needs one.
"pipx:keymap-drawer" = { version = "latest", os = ["macos/arm64", "linux/x64", "linux/arm64"], install_env = { UV_PYTHON = "python3.13" }, depends = ["python", "uv"] }
"github:PyO3/maturin" = { version = "latest", os = ["macos/arm64", "linux/x64", "linux/arm64"], filter_bins = "maturin" }
"pipx:mlx-whisper" = { version = "latest", os = ["macos/arm64"], install_env = { UV_PYTHON = "python3.13" }, depends = ["python", "uv"] }
"pipx:worldlines" = { version = "latest", os = ["macos/arm64", "linux/x64", "linux/arm64"], install_env = { UV_PYTHON = "python3.13" }, depends = ["python", "uv"] }
"pipx:xonsh" = { version = "latest", os = ["macos/arm64", "linux/x64", "linux/arm64"], install_env = { UV_PYTHON = "python3.13" }, depends = ["python", "uv"] }

# Julia retains the current upstream HTTP backend, version list and release
# URL layout. The pinned version uses the explicit 1.12 release directory.
[tools.julia]
version = "1.12.6"
os = ["macos/arm64", "linux/x64", "linux/arm64"]
version_list_url = "https://julialang-s3.julialang.org/bin/versions.json"

[tools.julia.platforms.linux-arm64]
url = """https://julialang-s3.julialang.org/bin/linux/aarch64/1.12/julia-{{ version }}-linux-aarch64.tar.gz"""

[tools.julia.platforms.linux-x64]
url = """https://julialang-s3.julialang.org/bin/linux/x64/1.12/julia-{{ version }}-linux-x86_64.tar.gz"""

[tools.julia.platforms.macos-arm64]
url = """https://julialang-s3.julialang.org/bin/mac/aarch64/1.12/julia-{{ version }}-macaarch64.tar.gz"""

# Native packages stay in the Homebrew prefix. Every item is Mac-only, so a
# Linux workstation never inherits Mac system integration or GUI packages.
[bootstrap.packages]
# Upstream btop publishes Linux binaries; macOS keeps its native formula.
"brew:btop" = { os = "macos/arm64" }
# Existing unmanaged bundles: native adoption keeps matching live apps in place.
# Antinote adoption waits for explicit installer licence consent; see vendor-apps.tsv.
"brew-cask:blender" = { os = "macos/arm64", adopt = true }
"brew-cask:cotypist" = { os = "macos/arm64", adopt = true }
"brew-cask:crossover" = { os = "macos/arm64", adopt = true }
"brew-cask:google-chrome" = { os = "macos/arm64", adopt = true }

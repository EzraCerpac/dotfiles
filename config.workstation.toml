[vars]
profile = "workstation"

[env]
SETUP_PROFILE = "workstation"
# Mise owns these coding CLIs; leave updates under the explicit Mise workflow.
DISABLE_AUTOUPDATER = "1"
GROK_DISABLE_AUTOUPDATER = "1"
AGY_CLI_DISABLE_AUTO_UPDATE = "true"

[tools]
# Routine updates defer Herdr while its persistent terminal server is running.
herdr = { version = "latest", os = ["macos/arm64", "linux/x64", "linux/arm64"] }
# Ruby is required to evaluate supported third-party Homebrew recipes.
ruby = { version = "latest", os = ["macos/arm64"] }
# The workstation baseline is macOS arm64 plus glibc Linux x64/arm64.
go = { version = "latest", os = ["macos/arm64", "linux/x64", "linux/arm64"] }
rust = { version = "latest", os = ["macos/arm64", "linux/x64", "linux/arm64"] }
# Latest is the default; older interpreters serve existing global application environments.
python = [
  { version = "latest", os = ["macos/arm64", "linux/x64", "linux/arm64"] },
  { version = "3.13", os = ["macos/arm64", "linux/x64", "linux/arm64"] },
  { version = "3.12", os = ["macos/arm64", "linux/x64", "linux/arm64"] },
]
pnpm = { version = "latest", os = ["macos/arm64", "linux/x64", "linux/arm64"] }

# Portable release-backed tools. `delta` is the command name; Homebrew calls
# its formula `git-delta`.
btop = { version = "latest", os = ["linux/x64", "linux/arm64"] }
"aqua:axodotdev/cargo-dist" = { version = "latest", os = ["macos/arm64", "linux/x64", "linux/arm64"] }
"aqua:JohnnyMorganz/StyLua" = { version = "latest", os = ["macos/arm64", "linux/x64", "linux/arm64"] }
"cargo:tokei" = { version = "latest", os = ["macos/arm64", "linux/x64", "linux/arm64"], depends = ["rust"] }
"github:trunk-rs/trunk" = { version = "latest", os = ["macos/arm64", "linux/x64", "linux/arm64"] }
"github:typst-community/tytanic" = { version = "latest", os = ["macos/arm64", "linux/x64", "linux/arm64"] }
"cargo:https://github.com/typst/package-check" = { version = "rev:d1bd0af255d688ce568be3c254efbdb002dc247a", os = ["macos/arm64", "linux/x64", "linux/arm64"], depends = ["rust"] }
"cargo:cargo-audit" = { version = "latest", os = ["macos/arm64", "linux/x64", "linux/arm64"], depends = ["rust"] }
"aqua:Kitware/CMake" = { version = "latest", os = ["macos/arm64", "linux/x64", "linux/arm64"] }
"core:deno" = { version = "latest", os = ["macos/arm64", "linux/x64", "linux/arm64"] }
gum = { version = "latest", os = ["macos/arm64", "linux/x64", "linux/arm64"] }
"git-lfs" = { version = "latest", os = ["macos/arm64", "linux/x64", "linux/arm64"] }
gitleaks = { version = "latest", os = ["macos/arm64", "linux/x64", "linux/arm64"] }
glow = { version = "latest", os = ["macos/arm64", "linux/x64", "linux/arm64"] }
jjui = { version = "latest", os = ["macos/arm64", "linux/x64", "linux/arm64"] }
lazygit = { version = "latest", os = ["macos/arm64", "linux/x64", "linux/arm64"] }
opencode = { version = "latest", os = ["macos/arm64", "linux/x64", "linux/arm64"] }
"github:jgm/pandoc" = { version = "latest", os = ["macos/arm64", "linux/x64", "linux/arm64"] }
rclone = { version = "latest", os = ["macos/arm64", "linux/x64", "linux/arm64"] }
sccache = { version = "latest", os = ["macos/arm64", "linux/x64", "linux/arm64"] }
swiftformat = { version = "latest", os = ["macos/arm64"] }
swiftlint = { version = "latest", os = ["macos/arm64"] }
television = { version = "latest", os = ["macos/arm64", "linux/x64", "linux/arm64"] }
tinymist = { version = "latest", os = ["macos/arm64", "linux/x64", "linux/arm64"] }
"cargo:tlrc" = { version = "latest", os = ["macos/arm64", "linux/x64", "linux/arm64"], depends = ["rust"] }
typst = { version = "latest", os = ["macos/arm64", "linux/x64", "linux/arm64"] }
typstyle = { version = "latest", os = ["macos/arm64", "linux/x64", "linux/arm64"] }
"aqua:jdx/usage" = { version = "latest", os = ["macos/arm64", "linux/x64", "linux/arm64"] }
worktrunk = { version = "latest", os = ["macos/arm64", "linux/x64", "linux/arm64"] }
xcodegen = { version = "latest", os = ["macos/arm64"] }
yazi = { version = "latest", os = ["macos/arm64", "linux/x64", "linux/arm64"] }
yt-dlp = { version = "latest", os = ["macos/arm64", "linux/x64", "linux/arm64"] }

# Global npm CLIs. portless is a local checkout symlink and stays owned by
# its project; the Codex CLI uses the native base-profile `codex` tool.
"npm:@zed-industries/codex-acp" = { version = "latest", os = ["macos/arm64", "linux/x64", "linux/arm64"] }
"npm:agent-browser" = { version = "latest", os = ["macos/arm64", "linux/x64", "linux/arm64"] }
# Requested upstream package; its repository and registry metadata were checked.
"npm:@lakeday/perch" = { version = "latest", allow_low_downloads = true, os = ["macos/arm64", "linux/x64", "linux/arm64"] }

# No pipx tools are declared; the former UV CLIs were removed as unwanted.
"github:PyO3/maturin" = { version = "latest", os = ["macos/arm64", "linux/x64", "linux/arm64"], filter_bins = "maturin" }

# The maintained asdf plugin derives Julia's minor release directory from the
# selected version, so latest can follow future Julia minors safely.
"asdf:mise-plugins/mise-julia" = { version = "latest", os = ["macos/arm64", "linux/x64", "linux/arm64"] }

# Native packages stay in the Homebrew prefix. Every item is Mac-only, so a
# Linux workstation never inherits Mac system integration or GUI packages.
[bootstrap.packages]
"brew:terminal-notifier" = { os = "macos/arm64" }
"apt:git" = { os = ["linux/x64", "linux/arm64"] }
"dnf:git" = { os = ["linux/x64", "linux/arm64"] }
"pacman:git" = { os = ["linux/x64", "linux/arm64"] }
# Upstream btop publishes Linux binaries; macOS keeps its native formula.
"brew:btop" = { os = "macos/arm64" }
# Existing unmanaged bundles: native adoption keeps matching live apps in place.
# Antinote adoption waits for explicit installer licence consent; see vendor-apps.tsv.
"brew-cask:cotypist" = { os = "macos/arm64", adopt = true }
"brew-cask:google-chrome" = { os = "macos/arm64", adopt = true }
"brew-cask:mathpix-snipping-tool" = { os = "macos/arm64", adopt = true }
# OmniDiskSweeper adoption waits for explicit installer licence consent.
"brew-cask:orion" = { os = "macos/arm64", adopt = true }
"brew-cask:plex" = { os = "macos/arm64", adopt = true }
"brew-cask:qlmarkdown" = { os = "macos/arm64", adopt = true }
"brew-cask:rustdesk" = { os = "macos/arm64", adopt = true }
"brew-cask:shottr" = { os = "macos/arm64", adopt = true }
"brew-cask:steam" = { os = "macos/arm64", adopt = true }
"brew-cask:t3-code@nightly" = { os = "macos/arm64", adopt = true }
"brew-cask:transmission" = { os = "macos/arm64", adopt = true }
# App Store receipts remain owned by the Mac App Store; use mas by numeric ID.
"brew:mas" = { os = "macos/arm64" }
"mas:640199958" = { os = "macos/arm64" } # Apple Developer
# de Volkskrant is installed but mas does not recognize its receipt.
"mas:1317704208" = { os = "macos/arm64" } # eduVPN
"mas:6698876601" = { os = "macos/arm64" } # Folder Preview
"mas:1504076137" = { os = "macos/arm64" } # geteduroam
"mas:1444383602" = { os = "macos/arm64" } # Goodnotes
"mas:1099568401" = { os = "macos/arm64" } # Home Assistant
# Logic Pro is installed but mas does not recognize its receipt.
"mas:905953485" = { os = "macos/arm64" } # NordVPN
"mas:310633997" = { os = "macos/arm64" } # WhatsApp
"apt:diffutils" = { os = ["linux/x64", "linux/arm64"] }
"dnf:diffutils" = { os = ["linux/x64", "linux/arm64"] }
"pacman:diffutils" = { os = ["linux/x64", "linux/arm64"] }
"brew:bash" = { os = "macos/arm64" }
"apt:pkg-config" = { os = ["linux/x64", "linux/arm64"] }
"apt:libssl-dev" = { os = ["linux/x64", "linux/arm64"] }
"dnf:pkgconf-pkg-config" = { os = ["linux/x64", "linux/arm64"] }
"dnf:openssl-devel" = { os = ["linux/x64", "linux/arm64"] }
"pacman:pkgconf" = { os = ["linux/x64", "linux/arm64"] }
"pacman:openssl" = { os = ["linux/x64", "linux/arm64"] }
# The old osx-cross recipes need Homebrew's dependency alias/build support.
# Their compiler-major pins are retained by the keyboard-toolchains exception.
# Custom-tap formulas use the tapped-tools exception until the native adapter
# handles their Homebrew DSL and macOS/build dependency declarations.
"brew:cliproxyapi" = { os = "macos/arm64" }
"brew:curl" = { os = "macos/arm64" }
"brew:dos2unix" = { os = "macos/arm64" }
"brew:ffmpeg" = { os = "macos/arm64" }
"brew:gitlogue" = { os = "macos/arm64" }
"brew:gnupg" = { os = "macos/arm64" }
"brew:graphviz" = { os = "macos/arm64" }
"brew:harper" = { os = "macos/arm64" }
"brew:himalaya" = { os = "macos/arm64" }
"brew:htop" = { os = "macos/arm64" }
"brew:librsvg" = { os = "macos/arm64" }
"brew:llvm" = { os = "macos/arm64" }
"brew:lua" = { os = "macos/arm64" }
"brew:m1ddc" = { os = "macos/arm64" }
"brew:mole" = { os = "macos/arm64" }
"brew:openai-whisper" = { os = "macos/arm64" }
"brew:openfst" = { os = "macos/arm64" }
"brew:pdfpc" = { os = "macos/arm64" }
"brew:pillow" = { os = "macos/arm64" }
"brew:pkgconf" = { os = "macos/arm64" }
"brew:pngpaste" = { os = "macos/arm64" }
"brew:poppler" = { os = "macos/arm64" }
"brew:pulseaudio" = { os = "macos/arm64" }
"brew:rsync" = { os = "macos/arm64" }
"brew:sshpass" = { os = "macos/arm64" }
"brew:summarize" = { os = "macos/arm64" }
"brew:tesseract" = { os = "macos/arm64" }
"brew:tree" = { os = "macos/arm64" }
"brew:unbound" = { os = "macos/arm64" }
"brew:wget" = { os = "macos/arm64" }
"brew:xdot" = { os = "macos/arm64" }

# Linux workstation bootstrap basics only. These do not include tools already
# declared above. Mise filters each manager by the host OS.
"apt:build-essential" = { os = ["linux/x64", "linux/arm64"] }
"apt:curl" = { os = ["linux/x64", "linux/arm64"] }
"apt:gnupg" = { os = ["linux/x64", "linux/arm64"] }
"apt:htop" = { os = ["linux/x64", "linux/arm64"] }
"apt:poppler-utils" = { os = ["linux/x64", "linux/arm64"] }
"apt:sshpass" = { os = ["linux/x64", "linux/arm64"] }
"apt:tree" = { os = ["linux/x64", "linux/arm64"] }
"apt:unzip" = { os = ["linux/x64", "linux/arm64"] }

"dnf:gcc" = { os = ["linux/x64", "linux/arm64"] }
"dnf:gcc-c++" = { os = ["linux/x64", "linux/arm64"] }
"dnf:make" = { os = ["linux/x64", "linux/arm64"] }
"dnf:curl" = { os = ["linux/x64", "linux/arm64"] }
"dnf:gnupg2" = { os = ["linux/x64", "linux/arm64"] }
"dnf:htop" = { os = ["linux/x64", "linux/arm64"] }
"dnf:poppler-utils" = { os = ["linux/x64", "linux/arm64"] }
"dnf:sshpass" = { os = ["linux/x64", "linux/arm64"] }
"dnf:tree" = { os = ["linux/x64", "linux/arm64"] }
"dnf:unzip" = { os = ["linux/x64", "linux/arm64"] }

"pacman:base-devel" = { os = ["linux/x64", "linux/arm64"] }
"pacman:curl" = { os = ["linux/x64", "linux/arm64"] }
"pacman:gnupg" = { os = ["linux/x64", "linux/arm64"] }
"pacman:htop" = { os = ["linux/x64", "linux/arm64"] }
"pacman:poppler" = { os = ["linux/x64", "linux/arm64"] }
"pacman:sshpass" = { os = ["linux/x64", "linux/arm64"] }
"pacman:tree" = { os = ["linux/x64", "linux/arm64"] }
"pacman:unzip" = { os = ["linux/x64", "linux/arm64"] }

# Cask declarations describe the desired owner only. Live transfer still
# requires the coordinated app-by-app procedure in docs/software-ownership.md.
"brew-cask:codexbar" = { os = "macos/arm64" }
"brew-cask:crisp" = { os = "macos/arm64" }
"brew-cask:font-fira-code-nerd-font" = { os = "macos/arm64" }
"brew-cask:font-hack-nerd-font" = { os = "macos/arm64" }
"brew-cask:font-symbols-only-nerd-font" = { os = "macos/arm64" }
"brew-cask:hammerspoon" = { os = "macos/arm64" }
"brew-cask:homerow" = { os = "macos/arm64" }
"brew-cask:jabref" = { os = "macos/arm64" }
"brew-cask:middleclick" = { os = "macos/arm64" }
"brew-cask:orbstack" = { os = "macos/arm64" }
"brew-cask:raycast" = { os = "macos/arm64" }
"brew-cask:wezterm" = { os = "macos/arm64" }


[bootstrap.directories]
"~/Projects" = { mode = "0755" }
"~/Scripts" = { mode = "0755" }
"~/.local/bin" = { mode = "0755" }
"~/.local/share" = { mode = "0755" }

# No ref: bootstrap clones missing sources and leaves existing revisions alone.
[bootstrap.repos]
"~/Projects/jj-waltz" = { url = "https://github.com/EzraCerpac/jj-waltz.git" }
"~/Projects/Tools/sift" = { url = "https://github.com/tylergibbs1/sift.git" }
"~/Projects/Tools/unclutter" = { url = "https://github.com/kitze/unclutter.git" }

[bootstrap.brew.taps]
"acsandmann/tap" = "https://github.com/acsandmann/homebrew-tap"
"antoniorodr/memo" = "https://github.com/antoniorodr/homebrew-memo"
"dastrobu/tap" = "https://github.com/dastrobu/homebrew-tap"
"ezracerpac/tap" = "https://github.com/EzraCerpac/homebrew-tap"
"felixkratz/formulae" = "https://github.com/felixkratz/homebrew-formulae"
"jundot/omlx" = "https://github.com/jundot/omlx"
"manaflow-ai/cmux" = "https://github.com/manaflow-ai/homebrew-cmux"
"nikitabobko/tap" = "https://github.com/nikitabobko/homebrew-tap"
"osx-cross/arm" = "https://github.com/osx-cross/homebrew-arm"
"osx-cross/avr" = "https://github.com/osx-cross/homebrew-avr"
"qmk/qmk" = "https://github.com/qmk/homebrew-qmk"
"steipete/tap" = "https://github.com/steipete/homebrew-tap"
"typewhisper/tap" = "https://github.com/typewhisper/homebrew-tap"


[bootstrap.macos.defaults."com.apple.dock"]
autohide = true
static-only = true
expose-group-apps = true
enterMissionControlByTopWindowDrag = false
[bootstrap.macos.defaults."com.apple.screencapture"]
type = "jpg"
[bootstrap.macos.defaults.NSGlobalDomain]
InitialKeyRepeat = 15.0
KeyRepeat = 2.0
[bootstrap.macos.defaults."com.apple.AppleMultitouchTrackpad"]
Clicking = true
[bootstrap.macos.keyboard]
fn_state = true

[[bootstrap.macos.defaults_entries]]
# Keep the host-scoped Gitlogue screensaver timeout disabled.
domain = "com.apple.screensaver"
key = "idleTime"
host = "current"
value = 0

[[bootstrap.macos.defaults_entries]]
# Enable Show Desktop without replacing other symbolic hot-key entries.
domain = "com.apple.symbolichotkeys"
key = "AppleSymbolicHotKeys"
path = ["36", "enabled"]
value = true


[bootstrap.hooks]
pre-dotfiles = 'export SETUP_PROFILE=workstation; bash "${MISE_CONFIG_DIR:-$HOME/.config/mise}/tasks/bootstrap/persist-selected" && bash "${MISE_CONFIG_DIR:-$HOME/.config/mise}/tasks/local/adopt-skeletons.sh" && bash "${MISE_CONFIG_DIR:-$HOME/.config/mise}/tasks/local/seed-configs.sh" && bash "${MISE_CONFIG_DIR:-$HOME/.config/mise}/tasks/local/private-permissions.sh" --prepare-source'
post-dotfiles = 'export SETUP_PROFILE=workstation; bash "${MISE_CONFIG_DIR:-$HOME/.config/mise}/tasks/local/finish-dotfiles.sh"'

# Managed files: individual links preserve application-owned neighbors.

"copilot-cli" = { version = "latest", os = ["macos/arm64", "linux/x64", "linux/arm64"] }
"core:deno" = { version = "latest", os = ["macos/arm64", "linux/x64", "linux/arm64"] }
delta = { version = "latest", os = ["macos/arm64", "linux/x64", "linux/arm64"] }
fd = { version = "latest", os = ["macos/arm64", "linux/x64", "linux/arm64"] }
fzf = { version = "latest", os = ["macos/arm64", "linux/x64", "linux/arm64"] }
gh = { version = "latest", os = ["macos/arm64", "linux/x64", "linux/arm64"] }

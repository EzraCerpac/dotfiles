[vars]
profile = "workstation"

[env]
SETUP_PROFILE = "workstation"
# Mise owns these coding CLIs; leave updates under the explicit Mise workflow.
DISABLE_AUTOUPDATER = "1"
GROK_DISABLE_AUTOUPDATER = "1"
AGY_CLI_DISABLE_AUTO_UPDATE = "true"

[tools]
# Client and persistent server must use a compatible private protocol.
# Upgrade this pin only when the existing terminal sessions can be restarted.
herdr = { version = "0.8.2", os = ["macos/arm64", "linux/x64", "linux/arm64"] }
# Ruby is required to evaluate supported third-party Homebrew recipes.
ruby = { version = "4", os = ["macos/arm64"] }
# The workstation baseline is macOS arm64 plus glibc Linux x64/arm64.
go = { version = "latest", os = ["macos/arm64", "linux/x64", "linux/arm64"] }
rust = { version = "latest", os = ["macos/arm64", "linux/x64", "linux/arm64"] }
uv = { version = "latest", os = ["macos/arm64", "linux/x64", "linux/arm64"] }
# Keep 3.13 first so it remains the default; ai-text-detector uses python3.12.
python = [
  { version = "3.13", os = ["macos/arm64", "linux/x64", "linux/arm64"] },
  { version = "3.12", os = ["macos/arm64", "linux/x64", "linux/arm64"] },
]
node = { version = "latest", os = ["macos/arm64", "linux/x64", "linux/arm64"] }
pnpm = { version = "latest", os = ["macos/arm64", "linux/x64", "linux/arm64"] }
"aqua:neovim/neovim" = { version = "0.12.4", os = ["macos/arm64", "linux/x64", "linux/arm64"] }

# Installed coding CLIs use their explicit Aqua registry packages.
"aqua:anthropics/claude-code" = { version = "latest", os = ["macos/arm64", "linux/x64", "linux/arm64"] }
"aqua:x.ai/cli/grok" = { version = "1.0.4", os = ["macos/arm64", "linux/x64", "linux/arm64"] }
"aqua:google-antigravity/antigravity-cli" = { version = "latest", os = ["macos/arm64", "linux/x64", "linux/arm64"] }

# Portable release-backed tools. `delta` is the command name; Homebrew calls
# its formula `git-delta`.
actionlint = { version = "latest", os = ["macos/arm64", "linux/x64", "linux/arm64"] }
age = { version = "latest", os = ["macos/arm64", "linux/x64", "linux/arm64"] }
atuin = { version = "latest", os = ["macos/arm64", "linux/x64", "linux/arm64"] }
bat = { version = "latest", os = ["macos/arm64", "linux/x64", "linux/arm64"] }
btop = { version = "latest", os = ["linux/x64", "linux/arm64"] }
carapace = { version = "latest", os = ["macos/arm64", "linux/x64", "linux/arm64"] }
"aqua:axodotdev/cargo-dist" = { version = "latest", os = ["macos/arm64", "linux/x64", "linux/arm64"] }
"aqua:JohnnyMorganz/StyLua" = { version = "latest", os = ["macos/arm64", "linux/x64", "linux/arm64"] }
"cargo:tokei" = { version = "latest", os = ["macos/arm64", "linux/x64", "linux/arm64"], depends = ["rust"] }
"github:trunk-rs/trunk" = { version = "0.21.14", os = ["macos/arm64", "linux/x64", "linux/arm64"] }
"github:typst-community/tytanic" = { version = "latest", os = ["macos/arm64", "linux/x64", "linux/arm64"] }

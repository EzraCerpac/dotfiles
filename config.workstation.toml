[bootstrap.macos.defaults."com.apple.dock"]
static-only = true
expose-group-apps = true
enterMissionControlByTopWindowDrag = false
[bootstrap.macos.defaults."com.apple.screencapture"]
type = "jpg"
[bootstrap.macos.keyboard]
fn_state = true

[[bootstrap.macos.defaults_entries]]
# Keep the host-scoped Gitlogue screensaver timeout disabled.
domain = "com.apple.screensaver"
key = "idleTime"
host = "current"
value = 0

[[bootstrap.macos.defaults_entries]]
# Enable Show Desktop without replacing other symbolic hot-key entries.
domain = "com.apple.symbolichotkeys"
key = "AppleSymbolicHotKeys"
path = ["36", "enabled"]
value = true


[bootstrap.hooks]
pre-packages = 'export SETUP_PROFILE=workstation; bash "${MISE_CONFIG_DIR:-$HOME/.config/mise}/tasks/local/ensure-homebrew-exceptions.sh"'
pre-dotfiles = 'export SETUP_PROFILE=workstation; bash "${MISE_CONFIG_DIR:-$HOME/.config/mise}/tasks/bootstrap/persist-selected" && bash "${MISE_CONFIG_DIR:-$HOME/.config/mise}/tasks/local/adopt-skeletons.sh" && bash "${MISE_CONFIG_DIR:-$HOME/.config/mise}/tasks/local/prepare-directories.sh" && bash "${MISE_CONFIG_DIR:-$HOME/.config/mise}/tasks/local/seed-configs.sh" && bash "${MISE_CONFIG_DIR:-$HOME/.config/mise}/tasks/local/private-permissions.sh" --prepare-source'
post-dotfiles = 'export SETUP_PROFILE=workstation; bash "${MISE_CONFIG_DIR:-$HOME/.config/mise}/tasks/local/finish-dotfiles.sh"'

# Managed files: individual links preserve application-owned neighbors.
[dotfiles]
"~/.bash_profile" = { source = "dotfiles/.bash_profile", mode = "symlink", variants = [{ os = "macos" }, { os = "linux" }] }
"~/.bashrc" = { source = "templates/.bashrc.tera", mode = "template", variants = [{ os = "macos" }, { os = "linux" }] }
"~/.codex/AGENTS.md" = { source = "dotfiles/.codex/AGENTS.md", mode = "symlink", variants = [{ os = "macos" }, { os = "linux" }] }
"~/.codex/rules/rift.rules" = { source = "dotfiles/.codex/rules/rift.rules", mode = "symlink", variants = [{ os = "macos" }] }
"~/.codex/skills/audio-diarization/SKILL.md" = { source = "dotfiles/.codex/skills/audio-diarization/SKILL.md", mode = "symlink", variants = [{ os = "macos" }, { os = "linux" }] }
"~/.codex/skills/audio-diarization/scripts/transcribe_diarize.py" = { source = "dotfiles/.codex/skills/audio-diarization/scripts/transcribe_diarize.py", mode = "symlink", variants = [{ os = "macos" }, { os = "linux" }] }
"~/.codex/skills/jj-waltz/SKILL.md" = { source = "dotfiles/.codex/skills/jj-waltz/SKILL.md", mode = "symlink", variants = [{ os = "macos" }, { os = "linux" }] }
"~/.codex/skills/jj-waltz/agents/openai.yaml" = { source = "dotfiles/.codex/skills/jj-waltz/agents/openai.yaml", mode = "symlink", variants = [{ os = "macos" }, { os = "linux" }] }

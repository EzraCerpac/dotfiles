[[actions]]
name = "revisions.diff"
desc = "diff"
lua = '''
local id = context.commit_id()
if not id then
  flash({ text = "No change selected", error = true })
  return
end

jj_interactive("--config", 'ui.pager=["hunk", "pager"]', "--config", 'ui.diff-formatter=":git"',
  "--config", 'ui.paginate="auto"', "diff", "-r", id)
'''

[[actions]]
name = "show-oplog-diff"
lua = '''
local op_id = context.operation_id()
if not op_id then
  flash({ text = "No operation selected", error = true })
  return
end

local out, err = jj("op", "show", op_id, "--color", "always")
if err then
  flash({ text = err, error = true })
  return
end

jjui.diff.show(out)
'''

[[bindings]]
action = "show-oplog-diff"
key = "ctrl+o"
scope = "oplog"
desc = "show oplog diff"

